<!DOCTYPE html>
<html>
<head>
    <title>My Study Planner</title>
    
  <style>
    body {
     font-family:Arial,sans-serif;
     background-color: #f2f7ff;
     text-align:center;
     padding:40px;
    }
    
    h1 {
      color:#3157a4
    }

    h2{
      color:#444
    }

    p{
      color: #666;
      font-size:18px;
    }
   

  </style>

  </head>


      <h1>My Study Planner</h1>

      <h2>Welcome!</h2>
    
      <p>Plan your studies and stay organized.</p>

      <h2>Today's Study Plan</h2>

      <div class="subjects">

      <div class="card">

        <h3>Mathematics</h3>
        <p>Study calculus and algebra</p>
      </div>
    
      <div class="card">
        <h3>Python</h3>
        <p>Practice Python Programs</p>
      </div>
      
      <div class="card">
        <h3>DSA</h3>
        <p>Practice data structures</p>
      </div>

    </div> 

    <h2>Today's Tasks</h2>
  
    <div class="tasks">
    <label>
      <input type="checkbox">
      Complete Mathematics
    </label>
    
    <label>
      <input type="checkbox">
      Practice Python
    </label>

    <label>
       <input type="checkbox">
      Practice DSA
    </label>
    </div>

    <h2>Study Progress</h2>

    <progress id="progress" value="0" max="3"></progress>

    <p id="progressText">0 of 3 tasks completed</p>

    <script>
    const checkboxes = document.querySelectorAll('.tasks input');

    checkboxes.forEach(function(box) {
    box.addEventListener('change', updateProgress);
  });

    function updateProgress() {
    const completed = document.querySelectorAll('.tasks input:checked').length;

    document.getElementById('progress').value = completed;
    document.getElementById('progressText').innerText =
        completed + " of 3 tasks completed";
   }
</script>
    </body>
    </html>
